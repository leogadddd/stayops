services:
  db:
    image: postgres:16-alpine
    container_name: stayops-db
    environment:
      POSTGRES_USER: stayops
      POSTGRES_PASSWORD: stayops
      POSTGRES_DB: stayops
    ports:
      - "5432:5432"
    volumes:
      - stayops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayops -d stayops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stayops-pgdata:
